apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
    app.kubernetes.io/part-of: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: payments
          image: 490233488193.dkr.ecr.us-east-2.amazonaws.com/shop:1.0.2
          args: ["payments"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  labels:
    app: payments
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
